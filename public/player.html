    .swal2-popup {

    @keyframes show {
        0% {

        100% {
            transform: scale(1);
            opacity: 1;
        }
    }


    @keyframes hide {
        0% {
            transform: scale(1);
            opacity: 1
        }

        100% {
            transform: scale(0.8);
            opacity: 0
        }
    }
</style>

<script>

    const Toast = Swal.mixin({
        toast: true,
        position: 'center',
        iconColor: 'white',
        customClass: {
            popup: 'colored-toast',
        },
        showConfirmButton: false,
        timer: 1500,
        timerProgressBar: true,
    })

    const UI_joingame = () => {
        $('#join_game_page').addClass('-translate-x-5 opacity-0');

        setTimeout(() => {
            $('#join_game_page').hide();
            $('#qcard').show();
        }, 300);

        setTimeout(() => {
            $('#qcard').removeClass('translate-x-10 opacity-0');
        }, 350);
    }

    const UI_backToJoinGame = () => {
        $('#qcard').addClass('translate-x-10 opacity-0');

        setTimeout(() => {
            $('#qcard').hide();
            $('#join_game_page').show();
        }, 300);

        setTimeout(() => {
            $('#join_game_page').removeClass('-translate-x-5 opacity-0');
        }, 350);
    }
</script>
