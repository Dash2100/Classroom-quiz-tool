<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- <link rel="stylesheet" href="/src/player.css"> -->
    <link rel="stylesheet" href="/src/player.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- sweetalert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>

    <title>問答系統 | QuizRace</title>
</head>

<body data-theme="light" class="antialiased h-dvh w-dvw select-none overflow-hidden bg-base-100">

    <div class="navbar bg-base-200 overflow-hidden">
        <div class="navbar-start">

        </div>
        <div class="navbar-center">
            <a class="btn btn-ghost text-xl font-extrabold">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M3 7h3" />
                    <path d="M3 11h2" />
                    <path
                        d="M9.02 8.801l-.6 6a2 2 0 0 0 1.99 2.199h7.98a2 2 0 0 0 1.99 -1.801l.6 -6a2 2 0 0 0 -1.99 -2.199h-7.98a2 2 0 0 0 -1.99 1.801z" />
                    <path d="M9.8 7.5l2.982 3.28a3 3 0 0 0 4.238 .202l3.28 -2.982" />
                </svg>QuizRace</a>
        </div>

        <div class="navbar-end px-3">
            <div class="dropdown">
                <div tabindex="0" role="button" class="btn btn-ghost btn-circle" onclick="toggleDarkmode();">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
                        <path d="M12 3l0 18" />
                        <path d="M12 9l4.65 -4.65" />
                        <path d="M12 14.3l7.37 -7.37" />
                        <path d="M12 19.6l8.85 -8.85" />
                    </svg>
                </div>
            </div>
        </div>

    </div>

    <div class="w-full h-full">
        <!-- join game -->
        <div id="join_game_page"
            class="p-8 rounded-xl bg-base-300 shadow-xl mx-auto mt-44 transition-all ease-in-out duration-300 w-11/12 max-w-xl bg-base-100">
            <div class="min-h-40 flex flex-col gap-3">
                <h2 class="text-3xl font-black text-center">加入一場遊戲</h2>
                <p class="text-md text-center">請輸入主辦方提供的遊戲代碼 (六位數字)</p>
                <div class="flex flex-col gap-3 mt-3 mx-5">
                    <input type="text" placeholder="輸入遊戲代碼" id="game_code" maxlength="6"
                        class="input input-bordered w-full mr-3 text-center focus:ring-0 focus:border-none">
                    <div class="card-actions justify-center">
                        <button class="btn btn-neutral w-full" onclick="joinGame()">
                            <p id="join_game_text">加入遊戲</p>
                            <span id="join_game_loading" class="loading loading-spinner loading-md hidden"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Naming Page -->
        <div id="naming_page"
            class="p-8 rounded-xl bg-base-300 shadow-xl mx-auto mt-44 transition-all ease-in-out duration-300 w-11/12 max-w-xl bg-base-100 opacity-0 translate-x-5"
            hidden>
            <div class="min-h-40 flex flex-col gap-3">
                <h2 class="text-3xl font-black text-center">輸入你的名字</h2>
                <p class="text-md text-center">就隨便想一個名字吧</p>
                <div class="flex flex-col gap-3 mt-3 mx-5">
                    <input type="text" placeholder="中文英文或數字" id="player_name" maxlength="20"
                        class="input input-bordered w-full mr-3 text-center focus:ring-0 focus:border-none">
                    <div class="card-actions justify-center">
                        <button class="btn btn-neutral w-full" onclick="enter_name()">
                            <p id="join_game_text">確認加入</p>
                            <span id="join_game_loading" class="loading loading-spinner loading-md hidden"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="qcard"
            class="w-full h-full max-w-screen-2xl mx-auto transition-all ease-in-out duration-300 translate-x-10 opacity-0 overflow-hidden"
            hidden>

            <div class="card bg-base-300 shadow-xl md:w-10/12 w-11/12 mx-auto mt-8">


                <div class="card-body h-[calc(100vh-238px)] p-0 overflow-hidden">
                    <div class="w-full h-full absolute bg-black rounded-xl opacity-35 z-50" id="card_overlay" hidden>
                    </div>

                    <div id="quque" class="flex flex-col gap-3 my-auto">
                        <lord-icon src="https://cdn.lordicon.com/kgvlhryh.json" trigger="loop"
                            style="width:250px;height:250px" class="mx-auto">
                        </lord-icon>
                        <h2 class="font-black text-3xl md:text-4xl text-center">等待其他玩家加入中...</h2>
                        <p class="text-xl md:text-2xl text-center">想想今天晚餐要吃什麼吧！</p>
                    </div>

                    <div id="waiting" class="flex flex-col gap-3 my-auto" style="display: none;">
                        <lord-icon src="https://cdn.lordicon.com/hmqggwrl.json" trigger="loop"
                            style="width:250px;height:250px" colors="primary:#545454,secondary:#b4b4b4" class="mx-auto">
                        </lord-icon>
                        <h2 class="font-black text-3xl md:text-4xl text-center">目前沒有題目！</h2>
                        <p class="text-xl md:text-2xl text-center">等待主持人出題中...</p>
                    </div>

                    <div id="main_game_card"></div>

                </div>

            </div>
        </div>
    </div>

    <!-- bottom bar -->
    <div class="navbar fixed bottom-0 bg-base-200 px-7">
        <div class="navbar-start">
            <p class="text-lg font-bold" id="current_game_code"></p>
        </div>

        <div class="navbar-end">
            <!-- connection state -->
            <div id="not_connected" class="flex gap-2" style="display: none;">
                <div class="w-3 h-3 rounded-full bg-gray-600 my-auto"></div>
                <p class="text-md my-auto font-bold">未連線</p>
            </div>

            <div id="connecting" class="flex gap-2">
                <div class="w-3 h-3 rounded-full bg-yellow-500 my-auto" style="display: none;"></div>
                <p class="text-md my-auto font-bold">連線中...</p>
            </div>

            <div id="connected" class="flex gap-2" style="display: none;">
                <div class="w-3 h-3 rounded-full bg-green-500 my-auto"></div>
                <p class="text-md my-auto font-bold">已連線</p>
            </div>
        </div>
    </div>

    <template id="vote_template">
        <div class="card-body h-[calc(100vh-15rem)]">
            <h2 class="card-title text-4xl">投票：{title}</h2>
            <p class="text-2xl">請選擇你認為正確的答案</p>
            <div class="grid md:grid-cols-2 gap-4 mt-5">
                <button class="btn text-base-100 btn-info h-max md:min-h-36 md:h-max md:p-0 text-xl md:text-2xl"
                    id="q1">第一個選項</button>
                <button class="btn text-base-100 btn-warning h-max md:min-h-36 md:h-max md:p-0 text-xl md:text-2xl"
                    id="q2">第二個選項</button>
                <button class="btn text-base-100 btn-success h-max md:min-h-36 md:h-max md:p-0 text-xl md:text-2xl"
                    id="q3">第三個選項</button>
                <button class="btn text-base-100 btn-error h-max md:min-h-36 md:h-max md:p-0 text-xl md:text-2xl"
                    id="q4">第四個選項</button>
            </div>
        </div>
    </template>

    <template id="ticket_template">
        <div class="card-body h-[calc(100vh-15rem)]">
            <div id="ticket" class="flex flex-col gap-3 my-auto">
                <lord-icon src="https://cdn.lordicon.com/lzgqzxrq.json" trigger="loop" style="width:250px;height:250px"
                    class="mx-auto">
                </lord-icon>
                <h2 class="font-black text-3xl md:text-4xl text-center">搶答</h2>
                <p class="text-xl md:text-2xl text-center">按鈕變成紅色後即可點擊搶答按鈕</p>
                <button class="btn btn-error text-base-100 text-xl mx-20 md:text-2xl" id="ticket_btn"
                    disabled>點擊搶答</button>
            </div>
        </div>
    </template>

    <template id="input_template">
        <div class="card-body h-[calc(100vh-15rem)]">
            <h2 class="card-title text-4xl">輸入：{title}</h2>
            <p class="text-2xl">請在輸入框中輸入你的答案</p>
            <lord-icon src="https://cdn.lordicon.com/ylvuooxd.json" trigger="hover" style="width:250px;height:250px"
                class="mx-auto">
            </lord-icon>
            <div class="flex gap-4">
                <input type="text" class="input input-bordered text-xl w-full md:text-2xl" id="input_answer"
                    placeholder="輸入你的答案">
                <button class="btn btn-primary text-xl md:text-2xl" id="submit_input">送出</button>
            </div>
        </div>
    </template>

</body>

<script src="/socket.io/socket.io.js"></script>
<script src="/scripts/zepto.min.js"></script>
<script src="https://cdn.lordicon.com/lordicon.js"></script>

<script src="/src/player.js"></script>

</script>

</html>
