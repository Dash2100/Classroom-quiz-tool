<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/src/player.css">
    <script src="/scripts/zepto.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <!-- sweetalert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <title>主持畫面 | QuizRace</title>
</head>

<body>
    <h1>QuizRace</h1>
    <h2>遊戲代碼: <span id="game_code"></span></h2>

    <!-- 初始創建畫面 -->
    <div id="create_game_page">
        <button id="create_game_btn">創建遊戲</button>
        <br>
        <input type="text" id="game_code_input" placeholder="輸入遊戲代碼">
        <button id="join_game_btn">加入遊戲</button>
    </div>

    <!-- 遊戲腳本 -->
    <div id="update_detail_page" style="display: none;">
        <p>更新遊戲腳本</p>
        <textarea id="update_detail_input"></textarea>
        <button id="update_detail_btn">更新</button>
    </div>

    <!-- 等待玩家加入畫面 -->
    <div id="waiting_player_page" style="display: none;">
        <h2>等待玩家加入</h2>
        <button id="start_game_btn">開始遊戲</button>
        <div id="player-list"></div>
    </div>

    <!-- 發送題目 -->
    <div id="send_question" style="display: none;">
        <button id="start_game_btn">開始遊戲</button>
        <br>
        <button id="send_question_ticket">搶答</button>
        <button id="ticket_allow">開放搶答</button>
        <br>
        <button id="send_question_vote">投票</button>
        <button id="send_question_input">文字輸入</button>
        <br>
        <button id="send_URL">給 URL</button>
        <br>
        <button id="close_question">關閉題目</button>
    </div>

</body>

<script>
    let socket = io();
    let game_code = null;

    socket.on('connect', function () {
        console.log("connected")
    });

    socket.on('player_identify', function (data) {
        console.log(data)
        const messageList = document.getElementById("message-list")
        const messageElement = document.createElement("div")
        messageElement.innerText = data
        messageList.appendChild(messageElement)
    });

    $("document").ready(function () {

        $("#create_game_btn").click(function () {
            $.ajax({
                url: '/host/create',
                type: 'POST',
                contentType: 'application/json',
                success: function (data) {
                    if (data.status === "success") {
                        game_code = data.game_code

                        // update UI
                        $("#create_game_page").hide()
                        $("#waiting_player_page").show()
                        $("#game_code").text(game_code)

                        // socket connection
                        socket_connection(game_code);
                    }
                }
            });
        });

        $("#join_game_btn").click(function () {
            game_code = $("#game_code_input").val()

            $('#send_question').show();
            $('#create_game_page').hide();

        });

        $("#start_game_btn").click(function () {
            const data = {
                game_code: game_code
            }

            $.ajax({
                url: '/host/start',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function (data) {
                    if (data.status === "success") {
                        // update UI
                        $("#waiting_player_page").hide()
                        $('#send_question').show()
                    }
                }
            });
        });

        $("#update_detail_btn").click(function () {
            const data = {
                game_code: game_code,
                game_detail: $("#update_detail_input").val()
            }

            $.ajax({
                url: '/host/updateDetail',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function (data) {
                    if (data.status === "success") {
                        // update UI
                        $("#update_detail_page").hide()
                        $("#waiting_player_page").show()
                    }
                }
            });
        });

    });

    const socket_connection = (game_code) => {
        // listen to game event
        socket.on('game_' + game_code, function (data) {
            console.log(data)

            if (data.event === 'player_join') {
                const playerList = $("#player-list")
                const playerElement = $("<div></div>")
                playerElement.text(data.player_name)
                playerList.append(playerElement)
            }
        });
    }

    // three type 'ticket', 'vote', 'input' to select use SWAL
    $("#send_question_ticket").click(function () {
        Swal.fire({
            title: '發送搶答題',
            focusConfirm: false,
        }).then((result) => {
            if (result.value) {
                const answers = JSON.stringify(result.value)

                const data = {
                    game_code: game_code,
                    type: 'ticket_event',
                }

                $.ajax({
                    url: '/host/sendAction',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function (data) {
                        if (data.status === "success") {
                            console.log(data)
                        }
                    }
                });

                console.log(data);
            }
        })
    });

    $('#send_question_vote').click(function () {

        Swal.fire({
            title: '發送投票題',
            html: '<input id="swal-input1" class="swal2-input" placeholder="題目">' +
                '<input id="swal-input2" class="swal2-input" placeholder="選項1">' +
                '<input id="swal-input3" class="swal2-input" placeholder="選項2">' +
                '<input id="swal-input4" class="swal2-input" placeholder="選項3">' +
                '<input id="swal-input5" class="swal2-input" placeholder="選項4">',
            focusConfirm: false,
            preConfirm: () => {
                return [
                    document.getElementById('swal-input1').value,
                    document.getElementById('swal-input2').value,
                    document.getElementById('swal-input3').value,
                    document.getElementById('swal-input4').value,
                    document.getElementById('swal-input5').value
                ]
            }
        }).then((result) => {
            if (result.value) {
                const answers = JSON.stringify(result.value)

                const data = {
                    game_code: game_code,
                    type: 'vote',
                    question: result.value[0],
                    options: result.value.slice(1, 5),
                    answer: result.value[4]
                }

                $.ajax({
                    url: '/host/sendAction',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function (data) {
                        if (data.status === "success") {
                            console.log(data)
                        }
                    }
                });

                console.log(data);
            }
        })

    });

    $('#send_question_input').click(function () {

        Swal.fire({
            title: '發送文字輸入題',
            html: '<input id="swal-input1" class="swal2-input" placeholder="題目">',
            focusConfirm: false,
            preConfirm: () => {
                return [
                    document.getElementById('swal-input1').value,
                ]
            }
        }).then((result) => {
            if (result.value) {
                const answers = JSON.stringify(result.value)

                const data = {
                    game_code: game_code,
                    type: 'input',
                    question: result.value[0],
                }

                $.ajax({
                    url: '/host/sendAction',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function (data) {
                        if (data.status === "success") {
                            console.log(data)
                        }
                    }
                });

                console.log(data);
            }
        })

    });

    $("#ticket_allow").click(function () {
        const data = {
            game_code: game_code,
            type: 'ticket_allow'
        }

        $.ajax({
            url: '/host/sendAction',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function (data) {
                if (data.status === "success") {
                    console.log(data)
                }
            }
        });
    });

    $('#close_question').click(function () {
        const data = {
            game_code: game_code,
            type: 'close_question'
        }

        $.ajax({
            url: '/host/sendAction',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function (data) {
                if (data.status === "success") {
                    console.log(data)
                }
            }
        });
    });

    $('#send_URL').click(function () {
        Swal.fire({
            title: '發送網址',
            html: '<input id="swal-input1" class="swal2-input" placeholder="網址">',
            focusConfirm: false,
            preConfirm: () => {
                return [
                    document.getElementById('swal-input1').value,
                ]
            }
        }).then((result) => {
            if (result.value) {
                const answers = JSON.stringify(result.value)

                const data = {
                    game_code: game_code,
                    type: 'url',
                    question: result.value[0],
                }

                $.ajax({
                    url: '/host/sendAction',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function (data) {
                        if (data.status === "success") {
                            console.log(data)
                        }
                    }
                });

                console.log(data);
            }
        })

    });

</script>

<script src="/socket.io/socket.io.js"></script>
<script src="/scripts/zepto.min.js"></script>

</html>
